<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONSTRU — Edición Esmeralda del Bosque</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0a0f0a;
      color: #9bbc0f;
      font-family: "Courier New", monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    h1 { margin: 10px 0 2px; font-size: 18px; letter-spacing: 2px; color: #8bac0f; }
    p.sub { margin: 0 0 10px; font-size: 12px; color: #306230; }
    #frame {
      background: #306230;
      padding: 18px 18px 36px;
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7), inset 0 0 0 3px #0f380f;
    }
    #screen {
      background: #9bbc0f; border-radius: 6px; overflow: hidden;
      box-shadow: inset 0 0 0 6px #0f380f;
    }
    canvas {
      display: block; width: 720px; max-width: 94vw; height: auto;
      image-rendering: pixelated; image-rendering: crisp-edges;
    }
    .help { margin-top: 12px; font-size: 12px; color: #4a6b1f; max-width: 720px; text-align: center; }
    .brand { color:#0f380f; font-size:11px; text-align:center; margin-top:8px; letter-spacing:3px; }
  </style>
</head>
<body>
  <h1>▶ MONSTRU</h1>
  <p class="sub">Edición Esmeralda del Bosque — todo original</p>
  <div id="frame">
    <div id="screen">
      <canvas id="game" width="720" height="640"></canvas>
    </div>
    <div class="brand">M O N S T R U · P O C K E T</div>
  </div>
  <p class="help">
    Flechas / W A S D moverte · pisa la hierba alta para encontrar monstruos · ENTER abre el menú · en combate usa 1-4 o clic.
  </p>
  <script type="module" src="./game.js"></script>
</body>
</html>
