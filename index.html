<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MONSTRU — aventura de monstruos</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0b1120;
      color: #e8eefc;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    h1 { margin: 10px 0 2px; font-size: 20px; letter-spacing: 1px; color: #ffd54f; }
    p.sub { margin: 0 0 10px; font-size: 13px; color: #8fa6cc; }
    #wrap {
      background: #000; border-radius: 12px; overflow: hidden;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
      border: 1px solid #1e2b45;
    }
    canvas { display: block; width: 900px; max-width: 95vw; height: auto; image-rendering: auto; }
    .help { margin-top: 10px; font-size: 12px; color: #6f85aa; max-width: 900px; text-align: center; }
  </style>
</head>
<body>
  <h1>MONSTRU</h1>
  <p class="sub">Una aventura de monstruos por turnos — todo original</p>
  <div id="wrap">
    <canvas id="game" width="900" height="640"></canvas>
  </div>
  <p class="help">
    Flechas / W A S D para moverte · pisa la hierba para encontrar monstruos · en combate usa 1-4 o haz clic en los botones.
  </p>
  <script type="module" src="./game.js"></script>
</body>
</html>
